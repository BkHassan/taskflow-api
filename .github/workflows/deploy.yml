# Manual deploy only. This workflow is NOT finished until AWS + GitHub secrets exist.
# Do not enable "on: push" until MANUAL_TASKS.md is completed, or every push will fail.
name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/taskflow-api
            git pull origin main
            docker compose up --build -d
            docker compose ps
